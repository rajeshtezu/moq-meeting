# Local development relay. Run via `bun run dev` (see scripts/dev.ts).
[listen]
bind = "[::]:4443"
tls.generate = ["localhost"]

# Serves /certificate.sha256 (self-signed fingerprint) and the WebSocket fallback.
[web.http]
listen = "[::]:4443"

# Tokens are verified by `moq auth serve` running beside the relay.
[auth]
url = "http://127.0.0.1:4440/"
